name: CI
on:
  push:
    branches: [master, linux-port-foundation]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · tests · dead-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:web   # tsc --noEmit
      - run: npm test            # vitest run
      - run: npm run check:dead  # knip


  linux:
    name: Linux (CachyOS target · Rust clippy · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri and HID build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libudev-dev libfuse2 patchelf libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # Build the native Linux bundle so the PR produces an installable test artifact.
      - run: npx tauri build --bundles appimage
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked --bin sidearm-recover
      - uses: actions/upload-artifact@v4
        with:
          name: sidearm-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/sidearm-recover
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust (clippy · tests)
    # windows-latest, NOT ubuntu: most of the backend is #[cfg(target_os = "windows")]
    # (capture_backend/windows, platform/windows, Windows input_synthesis paths). On Linux
    # those modules are cfg'd out, so clippy/tests there would lint almost nothing.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Build the frontend first so tauri-build (build.rs) finds frontendDist (../dist).
      - run: npm run build
      # Pinned to the local dev toolchain (rustc 1.94.0): clippy lints drift between
      # Rust releases, so a floating @stable fails the gate whenever a newer clippy
      # adds lints that the locally-verified version does not flag. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run lint:rust   # clippy --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
